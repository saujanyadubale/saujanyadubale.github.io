<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 492" role="img" aria-labelledby="title desc">
<title id="title">ANTARES PMT quantum-efficiency measurement chain</title>
<desc id="desc">Xenon lamp provides illumination. MSH-300 monochromator selects wavelength. Optical path feeds either a PMT or calibrated silicon photodiode. Keithley 6487 and Python PyVISA record currents. Dark correction and photodiode calibration lead to QE and quality-control analysis.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102c39"/><stop offset="1" stop-color="#0a1925"/></linearGradient>
 <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#f6d57b"/><stop offset=".55" stop-color="#8fcddd"/><stop offset="1" stop-color="#9af6d1"/></linearGradient>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#98e8ce"/></marker>
 <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#04080d" flood-opacity=".4"/></filter>
</defs>
<rect width="1250" height="492" rx="20" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif">
 <text x="46" y="53" fill="#b7f7d7" font-size="14" font-weight="700" letter-spacing="2.6">OPTICAL HARDWARE → DATA ACQUISITION → QE</text>
 <text x="46" y="88" fill="#f1f9fa" font-size="25" font-weight="750">From a photon to a calibrated measurement</text>
